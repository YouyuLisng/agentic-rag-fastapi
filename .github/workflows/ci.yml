name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Dummy values -- pydantic-settings requires these fields to be present
  # at import time (several routers call get_settings() while applying
  # their @limiter.limit(...) decorator), but the unit test suite is
  # fully mocked and never makes a real Anthropic/Voyage/DB call, so the
  # actual values don't matter here.
  ANTHROPIC_API_KEY: dummy-for-ci
  VOYAGE_API_KEY: dummy-for-ci
  DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
  # No Langfuse keys in CI -- explicitly disable rather than rely on
  # the client's no-key no-op, so a future SDK change can't turn this
  # into real network calls during the test run.
  LANGFUSE_TRACING_ENABLED: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
        # No python-version input here -- `uv sync` reads .python-version
        # itself and downloads the matching interpreter on its own.

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Test (pytest)
        run: uv run pytest -q
