name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Dummy values -- pydantic-settings requires these fields to be present
  # at import time (several routers call get_settings() while applying
  # their @limiter.limit(...) decorator), but the unit test suite is
  # fully mocked and never makes a real Anthropic/Voyage/DB call, so the
  # actual values don't matter here.
  ANTHROPIC_API_KEY: dummy-for-ci
  VOYAGE_API_KEY: dummy-for-ci
  DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Test (pytest)
        run: uv run pytest -q
