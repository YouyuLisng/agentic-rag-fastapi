# Full private deployment: runs Postgres+pgvector, the FastAPI
# backend, and the Next.js frontend as three containers with no
# external cloud dependency (the local Postgres replaces Supabase --
# same schema, same pgvector extension, just self-hosted). Assumes
# agentic-rag-fastapi and agentic-rag-frontend are cloned as sibling
# directories (`frontend.build.context: ../agentic-rag-frontend`).
#
# ANTHROPIC_API_KEY / VOYAGE_API_KEY still come from .env in this
# directory -- those are third-party API keys, not something a local
# Postgres container can replace.
#
# Usage:
#   docker compose up --build
#   docker compose exec backend python -m app.scripts.seed   # once, after first startup

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: agentic_rag
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres's own entrypoint runs every *.sql file here, but only
      # on first init (an empty data directory) -- safe to leave
      # mounted permanently, it won't rerun against existing data.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/agentic_rag
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../agentic-rag-frontend
      args:
        # Build-time only (see that repo's Dockerfile) -- override for
        # a real deployment, e.g. --build-arg NEXT_PUBLIC_API_URL=https://api.example.com
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      # Host 3001, not 3000 -- matches the fallback Next.js's own dev
      # server already uses locally when 3000 is taken. Avoids a real
      # collision on machines where something else owns :3000 on
      # localhost's IPv6 (::1) resolution specifically, which `docker
      # ps`/container-side checks won't show since the conflict is
      # entirely on the host, outside Docker.
      - "3001:3000"

volumes:
  pgdata:
